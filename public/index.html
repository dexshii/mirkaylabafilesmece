<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Westeros: Kış Geliyor</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #c9c2b0; font-family: Georgia, serif; overflow: hidden; }
  canvas { display: block; }
  #select { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(#1a1a1f, #050506); z-index: 2; }
  h1 { letter-spacing: 4px; color: #d8cfb8; margin: 0 0 6px; text-align: center; }
  .sub { color: #7d7566; margin-bottom: 24px; font-style: italic; }
  #name { background: #141417; border: 1px solid #3a352c; color: #d8cfb8; padding: 8px 12px; font-family: inherit; margin-bottom: 20px; width: 220px; text-align: center; }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  .card { width: 200px; background: #121215; border: 1px solid #2c2922; padding: 16px; cursor: pointer; transition: .15s; }
  .card:hover { border-color: #a08a5a; transform: translateY(-3px); }
  .card canvas { margin: 0 auto 8px; }
  .card h3 { margin: 4px 0; color: #e0d6bd; }
  .card .t { font-size: 12px; color: #857c6a; font-style: italic; margin-bottom: 8px; }
  .card div.s { font-size: 13px; line-height: 1.6; }
  #hud { position: fixed; top: 12px; left: 12px; background: rgba(10,10,12,.75); border: 1px solid #2c2922; padding: 10px 14px; font-size: 13px; line-height: 1.6; display: none; }
</style>
</head>
<body>
<div id="select">
  <h1>KIŞ GELİYOR</h1>
  <div class="sub">Sınıfını seç, yabancı.</div>
  <input id="name" maxlength="16" placeholder="Adın">
  <div class="cards" id="cards"></div>
</div>
<div id="hud"></div>
<canvas id="game"></canvas>
<script src="/socket.io/socket.io.js"></script>
<script src="/classes.js"></script>
<script src="app.js"></script>
</body>
</html>
